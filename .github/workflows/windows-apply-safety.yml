name: windows-apply-safety

on:
  pull_request:
    paths:
      - ".github/workflows/windows-apply-safety.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/apply/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-replace-move:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Test Windows no-replace moves
        run: cargo test --locked --target x86_64-pc-windows-gnu --bin identedit rename_file_no_replace_
